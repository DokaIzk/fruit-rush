specVersion: 0.0.5
description: >
  Fruit Rush on-chain indexer — indexes cosmetic NFT mints, boast score
  attestations, and tournament lifecycle events from three contracts on Celo.
repository: https://github.com/fruit-rush/fruit-rush
schema:
  file: ./schema.graphql
dataSources:
  # ─── FruitRushCosmetics (ERC-1155 + UUPS proxy) ─────────────────────────────
  - kind: ethereum
    name: FruitRushCosmetics
    network: celo
    source:
      address: "0x3cE7C794bae69613800b54Df4E43d62d84C4f174"
      abi: FruitRushCosmetics
      startBlock: 73876139  # block cosmetics proxy was redeployed
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CosmeticItem
        - CosmeticBalance
        - CosmeticTransfer
      abis:
        - name: FruitRushCosmetics
          file: ./abis/FruitRushCosmetics.json
      eventHandlers:
        - event: CosmeticMinted(indexed address,indexed uint256,uint256)
          handler: handleCosmeticMinted
        - event: ItemTypeAdded(indexed uint256,uint256,string)
          handler: handleItemTypeAdded
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
      file: ./src/mappings/cosmetics.ts

  # ─── FruitRushBoast ──────────────────────────────────────────────────────────
  - kind: ethereum
    name: FruitRushBoast
    network: celo
    source:
      address: "0xAc9C17Eed06D935C255E5E5c668C5EF07EC79181"
      abi: FruitRushBoast
      startBlock: 73876411  # block boast contract was redeployed
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Boast
      abis:
        - name: FruitRushBoast
          file: ./abis/FruitRushBoast.json
      eventHandlers:
        - event: BoastMinted(indexed uint256,indexed address,uint256,string,uint256)
          handler: handleBoastMinted
      file: ./src/mappings/boast.ts

  # ─── FruitRushTournament (UUPS proxy) ────────────────────────────────────────
  - kind: ethereum
    name: FruitRushTournament
    network: celo
    source:
      address: "0xc396fa8D8fA76457eAD5772a936a896716D2640F"
      abi: FruitRushTournament
      startBlock: 73876467  # block tournament proxy was redeployed
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Tournament
        - TournamentEntry
        - TournamentPayout
      abis:
        - name: FruitRushTournament
          file: ./abis/FruitRushTournament.json
      eventHandlers:
        - event: TournamentCreated(indexed uint256,uint256,uint256,uint256,uint256[])
          handler: handleTournamentCreated
        - event: PlayerEntered(indexed uint256,indexed address,uint256)
          handler: handlePlayerEntered
        - event: TournamentFinalized(indexed uint256,address[],uint256[],uint256)
          handler: handleTournamentFinalized
        - event: TournamentRefunded(indexed uint256,uint256,uint256)
          handler: handleTournamentRefunded
      file: ./src/mappings/tournament.ts
