<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F17"/>
      <stop offset="100%" stop-color="#1A3A2A"/>
    </linearGradient>
    <linearGradient id="glow" x1="600" y1="100" x2="600" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8F542" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C8F542" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#C8F542" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="200" y1="0" x2="1200" y2="510"/>
    <line x1="400" y1="0" x2="1200" y2="390"/>
    <line x1="600" y1="0" x2="1200" y2="270"/>
    <line x1="800" y1="0" x2="1200" y2="150"/>
    <line x1="1000" y1="0" x2="1200" y2="30"/>
    <line x1="0" y1="126" x2="1000" y2="630"/>
    <line x1="0" y1="252" x2="800" y2="630"/>
    <line x1="0" y1="378" x2="600" y2="630"/>
    <line x1="0" y1="504" x2="400" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="1000" y1="0" x2="0" y2="510"/>
    <line x1="800" y1="0" x2="0" y2="390"/>
    <line x1="600" y1="0" x2="0" y2="270"/>
    <line x1="400" y1="0" x2="0" y2="150"/>
    <line x1="200" y1="0" x2="0" y2="30"/>
    <line x1="1200" y1="126" x2="200" y2="630"/>
    <line x1="1200" y1="252" x2="400" y2="630"/>
    <line x1="1200" y1="378" x2="600" y2="630"/>
    <line x1="1200" y1="504" x2="800" y2="630"/>
  </g>

  <!-- Watermelon (sliced in half) - left side -->
  <g transform="translate(250, 300)" filter="url(#shadow)">
    <!-- Left half -->
    <path d="M-60,-55 A75,75 0 0,0 -60,55 L-10,50 A60,60 0 0,1 -10,-50 Z" fill="#2D8B46"/>
    <path d="M-55,-48 A65,65 0 0,0 -55,48 L-12,44 A55,55 0 0,1 -12,-44 Z" fill="#E63946"/>
    <!-- Seeds -->
    <ellipse cx="-35" cy="-20" rx="3" ry="5" fill="#1A1A1A" transform="rotate(-15 -35 -20)"/>
    <ellipse cx="-30" cy="10" rx="3" ry="5" fill="#1A1A1A" transform="rotate(10 -30 10)"/>
    <ellipse cx="-40" cy="25" rx="3" ry="5" fill="#1A1A1A" transform="rotate(-5 -40 25)"/>
    <!-- Right half -->
    <path d="M60,-55 A75,75 0 0,1 60,55 L10,50 A60,60 0 0,0 10,-50 Z" fill="#2D8B46"/>
    <path d="M55,-48 A65,65 0 0,1 55,48 L12,44 A55,55 0 0,0 12,-44 Z" fill="#E63946"/>
    <!-- Seeds -->
    <ellipse cx="35" cy="-20" rx="3" ry="5" fill="#1A1A1A" transform="rotate(15 35 -20)"/>
    <ellipse cx="30" cy="10" rx="3" ry="5" fill="#1A1A1A" transform="rotate(-10 30 10)"/>
    <ellipse cx="40" cy="25" rx="3" ry="5" fill="#1A1A1A" transform="rotate(5 40 25)"/>
    <!-- Splash particles -->
    <circle cx="-70" cy="-30" r="4" fill="#E63946" opacity="0.8"/>
    <circle cx="70" cy="-25" r="3" fill="#E63946" opacity="0.7"/>
    <circle cx="-65" cy="35" r="5" fill="#2D8B46" opacity="0.6"/>
    <circle cx="60" cy="40" r="4" fill="#2D8B46" opacity="0.7"/>
  </g>

  <!-- Lemon (sliced) - center -->
  <g transform="translate(600, 280)" filter="url(#shadow)">
    <!-- Left half -->
    <path d="M-50,-40 A55,55 0 0,0 -50,40 L-8,35 A45,45 0 0,1 -8,-35 Z" fill="#F4D35E"/>
    <path d="M-44,-34 A48,48 0 0,0 -44,34 L-10,30 A40,40 0 0,1 -10,-30 Z" fill="#FFF3B0"/>
    <!-- Right half -->
    <path d="M50,-40 A55,55 0 0,1 50,40 L8,35 A45,45 0 0,0 8,-35 Z" fill="#F4D35E"/>
    <path d="M44,-34 A48,48 0 0,1 44,34 L10,30 A40,40 0 0,0 10,-30 Z" fill="#FFF3B0"/>
    <!-- Juice splash -->
    <circle cx="-55" cy="-20" r="3" fill="#F4D35E" opacity="0.8"/>
    <circle cx="55" cy="15" r="4" fill="#F4D35E" opacity="0.7"/>
    <circle cx="-50" cy="30" r="3" fill="#FFF3B0" opacity="0.6"/>
  </g>

  <!-- Orange (sliced) - right side -->
  <g transform="translate(950, 310)" filter="url(#shadow)">
    <!-- Left half -->
    <path d="M-55,-48 A62,62 0 0,0 -55,48 L-8,42 A52,52 0 0,1 -8,-42 Z" fill="#FF6B1A"/>
    <path d="M-48,-40 A55,55 0 0,0 -48,40 L-10,36 A46,46 0 0,1 -10,-36 Z" fill="#FFA94D"/>
    <!-- Right half -->
    <path d="M55,-48 A62,62 0 0,1 55,48 L8,42 A52,52 0 0,0 8,-42 Z" fill="#FF6B1A"/>
    <path d="M48,-40 A55,55 0 0,1 48,40 L10,36 A46,46 0 0,0 10,-36 Z" fill="#FFA94D"/>
    <!-- Splash -->
    <circle cx="-60" cy="-25" r="4" fill="#FF6B1A" opacity="0.7"/>
    <circle cx="60" cy="20" r="3" fill="#FFA94D" opacity="0.8"/>
  </g>

  <!-- Slash lines (dynamic cuts) -->
  <g stroke="#F4EDE0" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <!-- Main slash through center -->
    <line x1="150" y1="450" x2="1050" y2="120"/>
    <!-- Secondary slash -->
    <line x1="180" y1="480" x2="1020" y2="150" opacity="0.4" stroke-width="2"/>
  </g>

  <!-- Flame trail on slash -->
  <g filter="url(#blur1)" opacity="0.6">
    <path d="M150,450 Q400,350 600,300 Q800,250 1050,120" stroke="#FF6B1A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M160,445 Q410,345 610,295 Q810,245 1040,125" stroke="#C8F542" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Spark particles along slash -->
  <g opacity="0.9">
    <circle cx="300" cy="400" r="3" fill="#C8F542"/>
    <circle cx="310" cy="395" r="2" fill="#F4EDE0"/>
    <circle cx="500" cy="330" r="4" fill="#C8F542"/>
    <circle cx="510" cy="325" r="2" fill="#FF6B1A"/>
    <circle cx="700" cy="260" r="3" fill="#C8F542"/>
    <circle cx="710" cy="255" r="2" fill="#F4EDE0"/>
    <circle cx="900" cy="180" r="4" fill="#C8F542"/>
    <circle cx="890" cy="185" r="2" fill="#FF6B1A"/>
  </g>

  <!-- Title text -->
  <text x="600" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#F4EDE0" letter-spacing="6">
    FRUIT RUSH
  </text>
  <!-- Subtle glow behind text -->
  <text x="600" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#C8F542" opacity="0.2" letter-spacing="6" filter="url(#blur1)">
    FRUIT RUSH
  </text>

  <!-- Tagline -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#C8F542" opacity="0.7" letter-spacing="8">
    SLICE · SCORE · WIN
  </text>
</svg>
